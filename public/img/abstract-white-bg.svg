<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="blur1">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40" />
    </filter>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f7f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Base gradient background -->
  <rect width="1200" height="600" fill="url(#grad1)"/>

  <!-- Abstract circles and blobs -->
  <circle cx="100" cy="80" r="150" fill="#f0e8e5" opacity="0.6" filter="url(#blur1)"/>
  <circle cx="1050" cy="150" r="180" fill="#e8f0f8" opacity="0.5" filter="url(#blur1)"/>
  <circle cx="600" cy="-50" r="200" fill="#f8f0e8" opacity="0.4" filter="url(#blur1)"/>
  <circle cx="200" cy="500" r="160" fill="#e8e8f0" opacity="0.45" filter="url(#blur1)"/>
  <circle cx="950" cy="450" r="140" fill="#f0e8f0" opacity="0.5" filter="url(#blur1)"/>

  <!-- Subtle geometric elements -->
  <path d="M 0 100 Q 300 50 600 100 T 1200 100" stroke="#d4ccc7" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 0 500 Q 300 550 600 500 T 1200 500" stroke="#d4ccc7" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- Accent shapes -->
  <polygon points="1200,0 1200,150 1050,0" fill="#c73a41" opacity="0.08"/>
  <polygon points="0,600 0,450 150,600" fill="#c73a41" opacity="0.08"/>
</svg>